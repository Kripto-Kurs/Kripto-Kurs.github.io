  <script>
    // GitHub Pages SPA Redirect
    (function() {
      var path = window.location.pathname;
      var hash = window.location.hash;
      // If path contains a lecture name directly, convert to hash
      var match = path.match(/\/(lecture-\d+|supplement-[a-e]|tools|quiz|bib)/i);
      if (match) {
        window.location.replace("/#" + match[1]);
      } else {
        window.location.replace("/" + (hash || ""));
      }
    })();
  </script>
